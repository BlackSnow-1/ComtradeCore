name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ai-test-font:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei
      - uses: actions/upload-artifact@v7
        with:
          name: ai-test-font
          path: /usr/share/fonts/truetype/wqy/wqy-microhei.ttc

  cpp-ai-test:
    name: C++ AI (${{ matrix.name }})
    needs: ai-test-font
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-gcc, os: ubuntu-latest, compiler: '-DCMAKE_CXX_COMPILER=g++'}
          - {name: linux-clang, os: ubuntu-latest, compiler: '-DCMAKE_CXX_COMPILER=clang++'}
          - {name: windows-msvc, os: windows-latest, compiler: ''}
          - {name: macos-clang, os: macos-latest, compiler: ''}
    runs-on: ${{ matrix.os }}
    env:
      COMTRADE_TEST_FONT: ${{ github.workspace }}/test-font/wqy-microhei.ttc
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ai-test-font
          path: test-font
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev poppler-utils
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENSSL_ROOT_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
      - name: Configure C++ AI
        # On Windows this runs under pwsh (the runner's default shell; no `shell:` override
        # here), which type-infers an unquoted major.minor-looking token like 3.10 as a version
        # number and can silently truncate it to "3" plus a stray ".10" argument. Quoting the
        # value keeps it a plain string on every shell.
        run: >-
          cmake -S . -B build-ai ${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release -DCOMTRADE_BUILD_AI=ON
          -DCOMTRADE_BUILD_TESTS=ON -DCOMTRADE_BUILD_EXAMPLES=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
          "-DCMAKE_POLICY_VERSION_MINIMUM=3.10"
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/staging-ai"
      - run: cmake --build build-ai --config Release --parallel 2
      - name: Unit and local HTTP/PDF integration tests
        run: ctest --test-dir build-ai -C Release -L ai --output-on-failure --output-junit ai-tests.xml
      - name: Verify Chinese PDF text, pagination and rendering
        if: runner.os == 'Linux'
        run: python3 tests/verify_pdf.py build-ai/tests/ai-test-artifacts/EndToEndChinesePdf/report.pdf
      - run: cmake --install build-ai --config Release
      - name: Configure installed AI consumer
        run: >-
          cmake -S .github/ai-install-test -B ai-consumer ${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/staging-ai"
      - run: cmake --build ai-consumer --config Release --parallel 2
      - run: ctest --test-dir ai-consumer -C Release --output-on-failure
      - name: Include Windows TLS runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "$env:OPENSSL_ROOT_DIR/bin/*.dll" staging-ai/bin/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpp-ai-results-${{ matrix.name }}
          path: |
            build-ai/ai-tests.xml
            build-ai/tests/ai-test-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ComtradeCore-ai-${{ matrix.name }}
          path: staging-ai
          if-no-files-found: error

  build-test-install:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            compiler: -DCMAKE_CXX_COMPILER=g++
            artifact: linux-gcc
          - name: Linux Clang
            os: ubuntu-latest
            compiler: -DCMAKE_CXX_COMPILER=clang++
            artifact: linux-clang
          - name: macOS Apple Clang
            os: macos-latest
            compiler: -DCMAKE_CXX_COMPILER=/usr/bin/clang++
            artifact: macos-apple-clang
          - name: Windows MSVC
            os: windows-latest
            compiler: ""
            artifact: windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch accuracy-test fixtures
        shell: bash
        run: >-
          git lfs pull
          --include="tests/ComtradeFiles/cometrade/*.CFG,tests/ComtradeFiles/cometrade/*.DAT,tests/ComtradeFiles/SIMENS/20191024045947.CFG,tests/ComtradeFiles/SIMENS/20191024045947.DAT,tests/ComtradeFiles/Transient/*.cfg,tests/ComtradeFiles/Transient/*.dat,tests/ComtradeFiles/testfile/PQ06II6223#PQ06II6223_DR_9_20200701_102313_521.cfg,tests/ComtradeFiles/testfile/PQ06II6223#PQ06II6223_DR_9_20200701_102313_521.dat"
          --exclude=""

      - name: Show Apple Clang version
        if: runner.os == 'macOS'
        run: /usr/bin/clang++ --version

      - name: Configure
        run: >-
          cmake -S . -B build
          ${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DCOMTRADE_BUILD_TESTS=ON
          -DCOMTRADE_BUILD_EXAMPLES=ON
          -DCOMTRADE_REQUIRE_REAL_FIXTURES=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/staging"

      - name: Build
        id: core-build
        run: cmake --build build --config Release --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build -C Release -L unit --no-tests=error --output-on-failure --output-junit unit-tests.xml

      - name: Run standalone core examples
        run: ctest --test-dir build -C Release -L examples --no-tests=error --output-on-failure

      - name: Run real COMTRADE accuracy tests
        if: ${{ !cancelled() && steps.core-build.outcome == 'success' }}
        run: ctest --test-dir build -C Release -L accuracy --no-tests=error --output-on-failure --output-junit accuracy-tests.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results-${{ matrix.artifact }}
          path: |
            build/unit-tests.xml
            build/accuracy-tests.xml
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          retention-days: 14

      - name: Install
        run: cmake --install build --config Release

      - name: Configure installed-package consumer
        run: >-
          cmake -S .github/install-test -B install-test-build
          ${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/staging"

      - name: Build installed-package consumer
        run: cmake --build install-test-build --config Release --parallel 2

      - name: Test installed-package consumer
        run: ctest --test-dir install-test-build --build-config Release --output-on-failure

      - name: Upload installed package
        uses: actions/upload-artifact@v7
        with:
          name: ComtradeCore-${{ matrix.artifact }}
          path: staging
          if-no-files-found: error
          retention-days: 7

  java-integration:
    name: Java JNI integration (AI=${{ matrix.ai }})
    needs: ai-test-font
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ai: 'OFF', artifact: ComtradeCore-java-linux}
          - {ai: 'ON', artifact: ComtradeCore-java-ai-linux}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install JDK, SWIG and AI development dependencies
        run: sudo apt-get update && sudo apt-get install -y default-jdk swig libssl-dev
      - uses: actions/download-artifact@v8
        with:
          name: ai-test-font
          path: test-font
      - name: Configure Java and core tests
        run: >-
          cmake -S . -B build-java -DCMAKE_BUILD_TYPE=Release
          -DBUILD_JAVA_BINDINGS=ON -DCOMTRADE_BUILD_TESTS=ON
          -DCOMTRADE_BUILD_AI=${{ matrix.ai }} -DCOMTRADE_BUILD_EXAMPLES=ON
      - run: cmake --build build-java --parallel 2
      - name: Run actual JVM integration tests and examples
        run: ctest --test-dir build-java -R 'Java\.' --output-on-failure --no-tests=error
      - name: Install JAR and JNI library into an independent prefix
        run: cmake --install build-java --component Java --prefix "${{ github.workspace }}/staging-java"
      - name: Compile independent consumer against the installed JAR
        run: >-
          cmake -S .github/java-install-test -B java-installed-consumer
          -DCOMTRADE_JAVA_DIR="${{ github.workspace }}/staging-java/lib/comtrade/java"
          -DCOMTRADE_EXPECT_AI=${{ matrix.ai }}
          -DCOMTRADE_TEST_FONT="${{ github.workspace }}/test-font/wqy-microhei.ttc"
      - run: cmake --build java-installed-consumer
      - name: Run installed Java core or AI HTTP/PDF consumer
        run: ctest --test-dir java-installed-consumer --output-on-failure --no-tests=error --output-junit java-install-results.xml
      - name: Upload tested Java installation
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: staging-java
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: java-install-results-ai-${{ matrix.ai }}
          path: |
            java-installed-consumer/java-install-results.xml
            java-installed-consumer/Testing/Temporary/LastTest.log

  openssl-source-fallback:
    name: OpenSSL GitHub source fallback
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install source-build tools
        run: sudo apt-get update && sudo apt-get install -y perl make g++
      - name: Force source fallback even when system OpenSSL exists
        run: >-
          cmake -S . -B build-openssl -DCMAKE_BUILD_TYPE=Release
          -DCOMTRADE_BUILD_AI=ON -DCOMTRADE_FORCE_FETCH_OPENSSL=ON
          -DCOMTRADE_BUILD_TESTS=OFF -DCOMTRADE_BUILD_EXAMPLES=OFF
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/staging-openssl"
      - name: Reconfigure and reuse project-built OpenSSL without losing install rules
        run: cmake -S . -B build-openssl -DCOMTRADE_FORCE_FETCH_OPENSSL=OFF
      - name: Build and install AI with source-built OpenSSL
        run: |
          cmake --build build-openssl --parallel 2
          cmake --install build-openssl
      - name: Build and test installed consumer using packaged static OpenSSL
        run: |
          cmake -S .github/ai-install-test -B openssl-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/staging-openssl"
          cmake --build openssl-consumer --parallel 2
          ctest --test-dir openssl-consumer --output-on-failure --no-tests=error
      - name: Upload OpenSSL build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openssl-source-build-logs
          path: build-openssl/_deps/ai_openssl-build/*.log
