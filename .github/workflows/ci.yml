name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  java-ai-test:
    name: Java JNI and AI analysis tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: analysis/java/pom.xml
      - name: Install JNI and PDF test dependencies
        run: sudo apt-get update && sudo apt-get install -y swig fonts-dejavu-core
      - name: Build and install Java JNI
        run: |
          cmake -S . -B build-java -DBUILD_JAVA_BINDINGS=ON -DCOMTRADE_BUILD_TESTS=OFF -DCOMTRADE_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/staging"
          cmake --build build-java --parallel 2
          cmake --install build-java
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$PWD/staging/lib/comtrade/java/comtrade-core-java.jar" -DgroupId=io.github.blacksnow1 -DartifactId=comtrade-core-java -Dversion=1.2.0.0 -Dpackaging=jar -DgeneratePom=true
      - name: Test statistics, mock HTTP, actual JNI and PDF export
        run: mvn -B -f analysis/java/pom.xml verify -Dnative.library.path="$PWD/staging/lib/comtrade/java"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-ai-test-results
          path: analysis/java/target/surefire-reports
      - name: Assemble Java release files
        run: |
          mkdir -p java-package
          cp staging/lib/comtrade/java/* java-package/
          cp analysis/java/target/comtrade-ai-java-*.jar java-package/
          cp analysis/java/pom.xml java-package/comtrade-ai-java-1.2.0.0.pom
          cp config/ai-config.example.json java-package/
          cp README.md LICENSE java-package/
      - uses: actions/upload-artifact@v7
        with:
          name: ComtradeCore-java-ai-linux
          path: java-package
          if-no-files-found: error

  build-test-install:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            compiler: -DCMAKE_CXX_COMPILER=g++
            artifact: linux-gcc
          - name: Linux Clang
            os: ubuntu-latest
            compiler: -DCMAKE_CXX_COMPILER=clang++
            artifact: linux-clang
          - name: macOS Apple Clang
            os: macos-latest
            compiler: -DCMAKE_CXX_COMPILER=/usr/bin/clang++
            artifact: macos-apple-clang
          - name: Windows MSVC
            os: windows-latest
            compiler: ""
            artifact: windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch accuracy-test fixtures
        shell: bash
        run: >-
          git lfs pull
          --include="tests/ComtradeFiles/cometrade/*.CFG,tests/ComtradeFiles/cometrade/*.DAT,tests/ComtradeFiles/SIMENS/20191024045947.CFG,tests/ComtradeFiles/SIMENS/20191024045947.DAT,tests/ComtradeFiles/Transient/*.cfg,tests/ComtradeFiles/Transient/*.dat,tests/ComtradeFiles/testfile/PQ06II6223#PQ06II6223_DR_9_20200701_102313_521.cfg,tests/ComtradeFiles/testfile/PQ06II6223#PQ06II6223_DR_9_20200701_102313_521.dat"
          --exclude=""

      - name: Show Apple Clang version
        if: runner.os == 'macOS'
        run: /usr/bin/clang++ --version

      - name: Configure
        run: >-
          cmake -S . -B build
          ${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DCOMTRADE_BUILD_TESTS=ON
          -DCOMTRADE_BUILD_EXAMPLES=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/staging"

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release

      - name: Configure installed-package consumer
        run: >-
          cmake -S .github/install-test -B install-test-build
          ${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/staging"

      - name: Build installed-package consumer
        run: cmake --build install-test-build --config Release --parallel 2

      - name: Test installed-package consumer
        run: ctest --test-dir install-test-build --build-config Release --output-on-failure

      - name: Upload installed package
        uses: actions/upload-artifact@v7
        with:
          name: ComtradeCore-${{ matrix.artifact }}
          path: staging
          if-no-files-found: error
          retention-days: 7
